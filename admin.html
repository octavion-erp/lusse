<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LUSSÉ Admin — Products</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f0a06;--surface:#1a120a;--card:#221710;--card-hover:#291d13;
  --ink:#f3ebde;--ink-soft:#c2b09a;--muted:#7a6b58;
  --accent:#cba766;--accent-soft:#e2c68a;--accent-dark:#8a6b3b;
  --danger:#c76b6b;--success:#7ba86b;
  --hair:rgba(232,214,184,.12);--card-b:rgba(232,214,184,.09);
  --shadow:0 20px 60px -30px rgba(0,0,0,.7);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink-soft);font-family:"Manrope",system-ui,sans-serif;font-weight:300;margin:0;line-height:1.6;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(203,167,102,.06),transparent 60%),var(--bg);min-height:100vh}
h1,h2,h3{font-family:"Cormorant",serif;font-weight:500;color:var(--ink);letter-spacing:.005em;margin:0;line-height:1.15}
h1{font-size:2.4rem;font-weight:600}
h2{font-size:1.65rem;font-style:italic}
h3{font-size:1.1rem;font-weight:500}
.brand{font-family:"Cormorant",serif;font-weight:600;letter-spacing:.5em;color:var(--accent);font-size:1.15rem;padding-left:.5em}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,44px)}
a{color:var(--accent-soft)}
a:hover{color:var(--accent)}

/* header */
header{padding:34px 0 26px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.head-l{display:flex;flex-direction:column;gap:6px}
.head-r{display:flex;gap:10px;flex-wrap:wrap}
main{padding:44px 0 90px}

/* buttons */
button,.btn{background:linear-gradient(135deg,var(--accent-soft),var(--accent) 60%,var(--accent-dark));color:#1a1206;border:0;border-radius:999px;padding:12px 26px;font-family:"Manrope",sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.25s cubic-bezier(.2,.7,.2,1);box-shadow:0 8px 22px -12px rgba(203,167,102,.5);position:relative;overflow:hidden}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(203,167,102,.7)}
button::after{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,245,220,.35),transparent);transform:skewX(-24deg);transition:.6s}
button:hover::after{left:130%}
button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
button:disabled::after{display:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--card-b);box-shadow:none}
button.ghost:hover{border-color:var(--accent);color:var(--accent);background:rgba(203,167,102,.04);transform:none}
button.ghost::after{display:none}
button.danger{background:transparent;color:var(--danger);border:1px solid rgba(199,107,107,.4);box-shadow:none}
button.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);transform:none}
button.danger::after{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:30px 32px;margin-bottom:18px;box-shadow:var(--shadow)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;gap:14px}
.section-head .eyebrow{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500}

/* forms */
label{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;font-weight:500}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--card-b);border-radius:10px;padding:13px 16px;color:var(--ink);font-family:"Manrope",sans-serif;font-size:.95rem;font-weight:300;transition:.2s}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--card-hover);box-shadow:0 0 0 3px rgba(203,167,102,.14)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 17px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:42px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}

/* product list */
.list{display:grid;gap:14px;margin-bottom:28px}
.p-row{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;background:var(--card);border:1px solid var(--card-b);border-radius:14px;padding:20px 24px;transition:.25s;position:relative;overflow:hidden}
.p-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),transparent);opacity:0;transition:.3s}
.p-row:hover{transform:translateX(3px);border-color:var(--accent-soft);background:var(--card-hover)}
.p-row:hover::before{opacity:1}
.p-info h3{font-size:1.15rem;margin:4px 0 6px;color:var(--ink);font-weight:500;font-style:normal}
.p-info .method{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
.p-info .price{font-family:"Cormorant",serif;color:var(--ink);font-size:1.35rem;font-style:italic;letter-spacing:.01em;margin-top:2px}
.p-info .price small{font-family:"Manrope",sans-serif;font-style:normal;color:var(--muted);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-left:8px}
.row-actions{display:flex;gap:8px}
.row-actions button{padding:9px 18px;font-size:.68rem;letter-spacing:.14em}

/* empty state */
.empty{text-align:center;padding:60px 20px;background:var(--card);border:1px dashed var(--card-b);border-radius:var(--radius);color:var(--muted)}
.empty .em-i{font-family:"Cormorant",serif;font-size:3rem;color:var(--accent);margin-bottom:10px;font-style:italic}
.empty p{margin:8px 0 0;font-size:.95rem}

/* dropzone */
.dz{border:2px dashed var(--card-b);border-radius:14px;padding:34px 24px;text-align:center;cursor:pointer;transition:.3s;background:var(--surface);position:relative;overflow:hidden}
.dz:hover,.dz.over{border-color:var(--accent);background:linear-gradient(135deg,var(--card-hover),var(--surface))}
.dz-i{font-family:"Cormorant",serif;font-size:2.2rem;color:var(--accent);margin-bottom:8px;line-height:1;font-style:italic}
.dz-msg b{color:var(--ink);font-weight:500;font-size:1rem}
.dz-msg p{margin:6px 0 0;font-size:.82rem;color:var(--muted);line-height:1.6}
.dz-msg a{color:var(--accent-soft);border-bottom:1px dotted var(--accent-soft)}
.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:14px}
.media-list .m{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--card-b);transition:.2s}
.media-list .m:hover{transform:scale(1.04);border-color:var(--accent)}
.media-list .m img,.media-list .m video{width:100%;height:100%;object-fit:cover;display:block}
.media-list .m .x{position:absolute;top:6px;right:6px;background:rgba(20,14,9,.9);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-size:.75rem;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:none;letter-spacing:0}
.media-list .m .x:hover{background:var(--danger);transform:none}
.media-list .m .x::after{display:none}
.warn{background:rgba(199,107,107,.10);border:1px solid rgba(199,107,107,.35);color:var(--ink-soft);padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:12px;line-height:1.6;display:none}
.warn.show{display:block}

/* publish */
.pub-log{background:var(--surface);border:1px solid var(--card-b);border-radius:12px;padding:18px 20px;font-family:"SF Mono","Monaco",Menlo,monospace;font-size:.82rem;color:var(--ink-soft);min-height:90px;line-height:1.75}
.pub-log .ok{color:var(--success)}
.pub-log .err{color:var(--danger)}
.pub-log .step{color:var(--ink-soft);opacity:.85}

/* export */
.export-box{position:relative}
.export-box textarea{font-family:"SF Mono","Monaco",Menlo,monospace;font-size:.74rem;line-height:1.5;min-height:240px;background:#0e0906;color:var(--ink-soft)}
.export-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

/* step */
.step{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--hair)}
.step:first-child{border:0;padding-top:8px}
.step .n{flex:0 0 34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--accent));color:#1a1206;display:grid;place-items:center;font-weight:600;font-family:"Cormorant",serif;font-size:1.05rem;font-style:italic}
.step .b b{color:var(--ink);font-weight:500;font-size:1rem}
.step .b p{margin:4px 0 0;font-size:.9rem;color:var(--ink-soft)}
.step .b code{background:var(--surface);padding:2px 8px;border-radius:4px;color:var(--accent-soft);font-size:.82rem;font-family:"SF Mono",Menlo,monospace}

/* hint */
.hint{color:var(--muted);font-size:.88rem;margin:8px 0 0;line-height:1.6}

/* toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--accent-soft),var(--accent));color:#160f07;padding:14px 30px;border-radius:999px;font-weight:600;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 20px 50px -14px rgba(0,0,0,.6),0 0 0 1px rgba(203,167,102,.15);z-index:99;transition:.35s cubic-bezier(.2,.7,.2,1);opacity:0;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* login */
.login-wrap{max-width:440px;margin:14vh auto 0;text-align:center;padding:0 24px}
.login-wrap .brand{font-size:1.5rem;padding:0;margin-bottom:8px;display:inline-block}
.login-wrap h1{font-size:2.1rem;margin:6px 0 12px;font-style:italic;font-weight:500}
.login-wrap .tagline{color:var(--muted);margin:0 0 40px;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase}
.login-wrap input{text-align:center;letter-spacing:.4em;font-size:1rem;padding:16px;background:var(--card)}
.login-wrap button{width:100%;margin-top:18px;padding:16px;font-size:.82rem}
#loginErr{color:var(--danger);font-size:.85rem;margin-top:14px;min-height:1.2em;letter-spacing:.02em}
.login-foot{margin-top:50px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* details/summary polish */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;margin-right:8px;transition:.2s;color:var(--accent)}
details[open]>summary::before{transform:rotate(90deg)}
</style>
</head>
<body>

<section id="loginView" class="login-wrap">
  <div class="brand">L U S S É</div>
  <h1>Admin</h1>
  <p class="tagline">Manage your collection</p>
  <input id="pw" type="password" placeholder="••••••" autocomplete="off">
  <button id="loginBtn">Enter</button>
  <p id="loginErr"></p>
  <div class="login-foot">LUSSÉ HAIR · Dubai</div>
</section>

<div id="app" style="display:none">
  <header class="wrap">
    <div class="head-l">
      <div class="brand">L U S S É</div>
      <h1>Products</h1>
    </div>
    <div class="head-r">
      <button id="addBtn">＋ New product</button>
      <button id="exportBtn">Publish</button>
      <button class="ghost" id="reloadBtn">Reload</button>
      <button class="ghost" id="logoutBtn">Logout</button>
    </div>
  </header>
  <main class="wrap">

    <div id="list" class="list"></div>

    <!-- editor -->
    <div id="editor" class="card" style="display:none">
      <div class="section-head"><h2 id="edTitle">Edit product</h2><div class="eyebrow">Details</div></div>
      <input id="ed_id" type="hidden">
      <label>Product name</label>
      <input id="ed_name" placeholder="Clip-in Hair Extensions Set">
      <div class="grid">
        <div>
          <label>Method (short)</label>
          <input id="ed_method" placeholder="Clip-in">
        </div>
        <div>
          <label>SKU (optional)</label>
          <input id="ed_sku" placeholder="LUSSE-CLIP-8P">
        </div>
        <div>
          <label>Price from (AED)</label>
          <input id="ed_priceFrom" type="number" min="0" placeholder="990">
        </div>
        <div>
          <label>Price to (AED, optional)</label>
          <input id="ed_priceTo" type="number" min="0" placeholder="2050">
        </div>
        <div>
          <label>Fit time</label>
          <input id="ed_fitTime" placeholder="5–10 min">
        </div>
        <div>
          <label>Wear time</label>
          <input id="ed_wearTime" placeholder="On & off · reusable">
        </div>
      </div>
      <label>Short description (1 line)</label>
      <input id="ed_shortDesc" placeholder="Full volume in minutes, no commitment.">
      <label>Long description</label>
      <textarea id="ed_longDesc" placeholder="Detailed product description…"></textarea>
      <label>Available lengths (comma separated)</label>
      <input id="ed_lengths" placeholder='14",16",18",20",22",24"'>
      <label>Image URL (optional — leave blank to use default)</label>
      <input id="ed_image" placeholder="https://lussehair.com/videos/vid1.mp4 or /product-clip.jpg">
      <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
        <button id="saveBtn">Save product</button>
        <button class="ghost" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <!-- export -->
    <div id="publishPanel" class="card" style="display:none">
      <div class="section-head"><h2>Publish to lussehair.com</h2><div class="eyebrow">Go Live</div></div>
      <p class="hint">One click sends your changes live. Deployment takes 15–30 seconds.</p>
      <div id="pubLog" class="pub-log"></div>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button id="publishNowBtn">Publish now</button>
        <button class="ghost" id="closePub">Cancel</button>
      </div>
      <details style="margin-top:22px">
        <summary style="cursor:pointer;color:var(--muted);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase">Advanced: export JSON</summary>
        <div class="export-box" style="margin-top:14px">
          <textarea id="jsonOut" readonly></textarea>
          <div class="export-actions">
            <button class="ghost" id="copyBtn">Copy JSON</button>
            <button class="ghost" id="downloadBtn">Download products.json</button>
          </div>
        </div>
      </details>
    </div>
      </div>
    </div>

  </main>
</div>

<div id="toast" class="toast"></div>

<script>
// ---- config ----
const ADMIN_HASH="6b83bcb3b4a9a1c4b6c0dc2c8f0f8b0e1d7d3d5e5a2c5d3d1c1c9e3c3e1a5b7d"; // sha256('lusse2026'), change later
const DEFAULT_PW="lusse2026";
const KEY="lusse-admin";
const DATA_KEY="lusse-products";

// ---- auth (super simple; change password in code) ----
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
document.getElementById("loginBtn").onclick=async()=>{
  const pw=document.getElementById("pw").value;
  if(pw===DEFAULT_PW){ sessionStorage.setItem(KEY,"1"); try{ sessionStorage.setItem("lusse-pw",pw); }catch(e){} show(); }
  else document.getElementById("loginErr").textContent="Wrong password.";
};
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()});
document.getElementById("logoutBtn").onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};

if(sessionStorage.getItem(KEY)) show();

async function show(){
  document.getElementById("loginView").style.display="none";
  document.getElementById("app").style.display="block";
  await load();
}

// ---- data ----
let data={products:[],currency:"AED",whatsapp:"971542005442",updated:""};
async function load(){
  const cached=localStorage.getItem(DATA_KEY);
  if(cached){data=JSON.parse(cached);}
  else{
    try{const r=await fetch("/products.json?_="+Date.now()); data=await r.json();}catch(e){}
  }
  render();
}
function saveLocal(){localStorage.setItem(DATA_KEY,JSON.stringify(data))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}

// ---- list ----
function render(){
  const list=document.getElementById("list");
  if(!data.products.length){
    list.innerHTML='<div class="empty"><div class="em-i">∅</div><h3 style="color:var(--ink);font-weight:500">No products yet</h3><p>Click <b>+ New product</b> to add your first extension.</p></div>';
    return;
  }
  list.innerHTML=data.products.map(p=>`
    <div class="p-row">
      <div class="p-info">
        <div class="method">${esc(p.method||"Hair extensions")}</div>
        <h3>${esc(p.name)}</h3>
        <div class="price">AED ${p.priceFrom||0}${p.priceTo?` – ${p.priceTo}`:""}<small>from</small></div>
      </div>
      <div class="row-actions">
        <button class="ghost" onclick="editP('${p.id}')">Edit</button>
        <button class="danger" onclick="delP('${p.id}')">Delete</button>
      </div>
    </div>`).join("");
}
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- add/edit ----
document.getElementById("addBtn").onclick=()=>openEd(null);
document.getElementById("cancelBtn").onclick=()=>document.getElementById("editor").style.display="none";
window.editP=id=>openEd(data.products.find(p=>p.id===id));
window.delP=id=>{if(confirm("Delete this product?")){data.products=data.products.filter(p=>p.id!==id);saveLocal();render();toast("Deleted")}};

function openEd(p){
  document.getElementById("editor").style.display="block";
  document.getElementById("edTitle").textContent=p?"Edit product":"New product";
  const v=(k,d="")=>document.getElementById("ed_"+k).value=p?(p[k]??d):d;
  v("id",p?p.id:"");v("name");v("method");v("sku");v("priceFrom");v("priceTo");v("fitTime");v("wearTime");v("shortDesc");v("longDesc");v("image");
  document.getElementById("ed_lengths").value=p?(p.lengths||[]).join(","):"";
  document.getElementById("editor").scrollIntoView({behavior:"smooth"});
}

document.getElementById("saveBtn").onclick=()=>{
  const val=k=>document.getElementById("ed_"+k).value.trim();
  const name=val("name");
  if(!name){toast("Name required");return}
  const id=val("id")||name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const p={id,name,method:val("method"),sku:val("sku"),
    priceFrom:+val("priceFrom")||0,priceTo:+val("priceTo")||undefined,
    fitTime:val("fitTime"),wearTime:val("wearTime"),
    shortDesc:val("shortDesc"),longDesc:val("longDesc"),image:val("image"),
    lengths:val("lengths").split(",").map(s=>s.trim()).filter(Boolean)};
  if(!p.priceTo)delete p.priceTo;
  const i=data.products.findIndex(x=>x.id===id);
  if(i>=0)data.products[i]=p; else data.products.push(p);
  data.updated=new Date().toISOString().slice(0,10);
  saveLocal();render();
  document.getElementById("editor").style.display="none";
  toast(i>=0?"Updated":"Added");
};

document.getElementById("reloadBtn").onclick=async()=>{
  if(confirm("Discard local edits and reload from server?")){localStorage.removeItem(DATA_KEY);await load();toast("Reloaded")}
};

// ---- export ----
document.getElementById("exportBtn").textContent="Publish";
document.getElementById("exportBtn").onclick=()=>{
  document.getElementById("jsonOut").value=JSON.stringify(data,null,2);
  document.getElementById("pubLog").innerHTML='<span class="step">Ready to publish '+data.products.length+' products.</span>';
  document.getElementById("publishPanel").style.display="block";
  document.getElementById("publishPanel").scrollIntoView({behavior:"smooth"});
};
document.getElementById("closePub").onclick=()=>document.getElementById("publishPanel").style.display="none";
document.getElementById("copyBtn").onclick=async()=>{
  await navigator.clipboard.writeText(document.getElementById("jsonOut").value);toast("Copied JSON");
};
document.getElementById("downloadBtn").onclick=()=>{
  const b=new Blob([document.getElementById("jsonOut").value],{type:"application/json"});
  const u=URL.createObjectURL(b);const a=document.createElement("a");
  a.href=u;a.download="products.json";a.click();URL.revokeObjectURL(u);
};
document.getElementById("publishNowBtn").onclick=async()=>{
  const btn=document.getElementById("publishNowBtn"), log=document.getElementById("pubLog");
  btn.disabled=true; btn.textContent="Publishing…";
  log.innerHTML='<span class="step">→ Sending changes to server…</span>';
  let pw=DEFAULT_PW; try{ const s=sessionStorage.getItem("lusse-pw"); if(s) pw=s; }catch(e){}
  try{
    const r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pw},body:JSON.stringify(data)});
    let j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok){
      log.innerHTML+='<br><span class="err">✗ '+esc(j.error||("HTTP "+r.status))+'</span>'+(j.detail?'<br><span class="err" style="opacity:.7">'+esc(j.detail)+'</span>':'');
      btn.disabled=false; btn.textContent="Publish now"; return;
    }
    log.innerHTML+='<br><span class="ok">✓ Committed successfully.</span><br><span class="step">→ Vercel is deploying now — 15–30 seconds…</span>';
    setTimeout(()=>{
      log.innerHTML+='<br><span class="ok">✓ Published! Refresh <a href="https://lussehair.com" target="_blank">lussehair.com</a> to see it.</span>';
      btn.textContent="Published ✓";
    }, 15000);
  }catch(e){
    log.innerHTML+='<br><span class="err">✗ Network error: '+esc(String(e))+'</span>';
    btn.disabled=false; btn.textContent="Publish now";
  }
};
</script>
</body>
</html>
