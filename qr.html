<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LUSSÉ — Digital Business Card</title>
<meta name="description" content="LUSSÉ Dubai · 100% Remy human hair extensions. Tap to WhatsApp, call, email, or save my contact.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0906">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0a0906;--surface:#141009;--surface-2:#1a140d;--surface-3:#221c14;
  --border:#2a231a;--border-2:#332a1f;
  --text:#f2ede4;--text-2:#c9c1b4;--text-3:#8b8578;
  --accent:#cba766;--accent-2:#e2c78a;--accent-dim:#8a6f42;
  --wa:#25d366;--tel:#4a90e2;
}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.5 "Jost",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
img,svg{display:block;max-width:100%}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

body{
  background:
    radial-gradient(1200px 800px at 20% 0%,rgba(203,167,102,.08),transparent 60%),
    radial-gradient(1000px 600px at 80% 100%,rgba(203,167,102,.05),transparent 60%),
    var(--bg);
  min-height:100vh;
  padding:40px 20px 60px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start
}

.card{width:100%;max-width:420px;text-align:center;animation:fadeup .6s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ==================== HERO ==================== */
.avatar{
  width:110px;height:110px;margin:8px auto 22px;border-radius:50%;
  background:linear-gradient(135deg,#1e1611,#0f0b06);
  border:1px solid rgba(203,167,102,.25);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 60px -20px rgba(203,167,102,.4)
}
.avatar img{width:60%;height:auto}
.brand{
  font-family:"Cormorant",serif;font-weight:500;font-size:32px;
  letter-spacing:.6em;color:var(--accent);padding-inline-start:.6em;
  margin:0 0 6px;line-height:1
}
.tagline{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--text-3);margin:0 0 4px}
.title{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin:0 0 4px;font-weight:500}
.city{font-size:13px;color:var(--text-3);margin:0}

/* ==================== PRIMARY ACTIONS ==================== */
.actions{display:grid;gap:10px;margin:32px 0}
.action{
  display:flex;align-items:center;justify-content:center;gap:10px;
  height:56px;padding:0 24px;border-radius:14px;font-size:15px;font-weight:500;
  letter-spacing:.02em;transition:.2s cubic-bezier(.2,.7,.2,1);
  background:var(--surface);border:1px solid var(--border-2);color:var(--text);
  -webkit-tap-highlight-color:transparent
}
.action:hover,.action:active{transform:translateY(-2px);background:var(--surface-2);border-color:rgba(203,167,102,.4)}
.action svg{width:22px;height:22px;flex-shrink:0}
.action.wa{background:linear-gradient(135deg,#25d366,#1eaa50);color:#fff;border-color:transparent;box-shadow:0 12px 30px -10px rgba(37,211,102,.5)}
.action.wa:hover{background:linear-gradient(135deg,#2ce072,#25b558)}
.action.primary{background:var(--accent);color:#1a1206;border-color:transparent;font-weight:600;box-shadow:0 12px 30px -10px rgba(203,167,102,.5)}
.action.primary:hover{background:var(--accent-2)}
.action.tel svg,.action.email svg{color:var(--accent)}

/* ==================== SECTION HEADER ==================== */
.hr{display:flex;align-items:center;gap:14px;margin:36px 0 20px;color:var(--text-3);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(203,167,102,.3),transparent)}

/* ==================== SOCIAL ROW ==================== */
.social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.social a{
  width:46px;height:46px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:.2s
}
.social a:hover{transform:translateY(-3px);border-color:var(--accent);color:var(--accent);background:var(--surface-2)}
.social a svg{width:20px;height:20px}

/* ==================== QR CODE ==================== */
.qr-block{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px 24px;margin-top:16px}
.qr-hd{color:var(--text-3);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px;font-weight:500}
.qr-inner{background:#fff;padding:16px;border-radius:14px;display:inline-block;margin-bottom:12px}
.qr-inner svg{width:180px;height:180px;display:block}
.qr-lb{font-size:13px;color:var(--text-3);margin-top:8px;letter-spacing:.02em}
.qr-lb b{color:var(--accent);font-weight:500}

/* ==================== VCARD / SHARE ROW ==================== */
.tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.tool{
  flex:1 1 140px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--border-2);color:var(--text-2);
  transition:.2s
}
.tool:hover{border-color:var(--accent);color:var(--text)}
.tool svg{width:16px;height:16px;color:var(--accent)}

/* ==================== FOOTER ==================== */
.foot{margin-top:44px;text-align:center;color:var(--text-3);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.foot a{color:var(--accent);text-decoration:none;letter-spacing:.18em}

/* ==================== TOAST ==================== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:#1a140d;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:500;z-index:100;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){.brand{font-size:26px}.action{height:52px;font-size:14px}}
</style>
</head>

<script>
"use strict";
const APP_URL="https://lussehair.com/qr";

let SETTINGS={brand:"LUSSÉ",tagline:"Remy Human Hair · Dubai",phone:"+971 54 200 5442",whatsapp:"971542005442",email:"info@lussehair.com",address:"Dubai · UAE",social:{instagram:"https://www.instagram.com/lussehaircom",website:"https://lussehair.com"}};

async function loadSettings(){
  try{
    const r=await fetch("/api/settings",{cache:"no-store"});
    if(r.ok){const s=await r.json();SETTINGS={...SETTINGS,...s,social:{...SETTINGS.social,...(s.social||{})}}}
  }catch(e){}
  applySettings();
}

function applySettings(){
  document.querySelector(".city").textContent=SETTINGS.address||"Dubai · UAE";
  // WhatsApp
  const waNum=(SETTINGS.whatsapp||"").replace(/\D/g,"");
  const waMsg="Hi LUSSÉ! I'd love to book a colour match consultation.";
  document.getElementById("waAction").href=waNum?`https://wa.me/${waNum}?text=${encodeURIComponent(waMsg)}`:"#";
  // Tel
  const tel=(SETTINGS.phone||"").replace(/[^\d+]/g,"");
  document.getElementById("telAction").href=tel?`tel:${tel}`:"#";
  document.getElementById("telLabel").textContent=SETTINGS.phone||"Call";
  // Email
  document.getElementById("emailAction").href=SETTINGS.email?`mailto:${SETTINGS.email}`:"#";
  document.getElementById("emailLabel").textContent=SETTINGS.email||"Email";
  // Socials
  const social=$("social");social.innerHTML="";
  Object.entries(SETTINGS.social||{}).forEach(([k,url])=>{
    if(!url||!ICONS[k])return;
    const a=document.createElement("a");
    a.href=url;a.target="_blank";a.rel="noopener";
    a.setAttribute("aria-label",LABELS[k]||k);
    a.title=LABELS[k]||k;
    a.innerHTML=ICONS[k];
    social.appendChild(a);
  });
}

// vCard download
document.getElementById("saveVcard").addEventListener("click",()=>{
  const s=SETTINGS;
  const vcf=[
    "BEGIN:VCARD","VERSION:3.0",
    `FN:${s.brand||"LUSSÉ"}`,
    `ORG:${s.brand||"LUSSÉ"} Hair Atelier`,
    `TITLE:100% Remy Human Hair Extensions`,
    s.phone?`TEL;TYPE=CELL,VOICE:${s.phone}`:"",
    s.whatsapp?`TEL;TYPE=CELL,VOICE:+${s.whatsapp}`:"",
    s.email?`EMAIL;TYPE=INTERNET:${s.email}`:"",
    s.address?`ADR;TYPE=WORK:;;${s.address};;;;`:"",
    `URL:https://lussehair.com`,
    (s.social&&s.social.instagram)?`X-SOCIALPROFILE;type=instagram:${s.social.instagram}`:"",
    "END:VCARD"
  ].filter(Boolean).join("\r\n");
  const blob=new Blob([vcf],{type:"text/vcard"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="LUSSE.vcf";document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  toast("Contact saved · check downloads");
});

// Share + copy
document.getElementById("shareBtn").addEventListener("click",async()=>{
  if(navigator.share){try{await navigator.share({title:"LUSSÉ",text:"Save my digital card",url:APP_URL});}catch(e){}}
  else{navigator.clipboard.writeText(APP_URL);toast("Link copied");}
});
document.getElementById("copyBtn").addEventListener("click",()=>{navigator.clipboard.writeText(APP_URL);toast("Link copied");});

// Generate the QR after qrcode.js loads
function renderQR(){
  if(typeof QRCode==="undefined"){setTimeout(renderQR,80);return;}
  new QRCode(document.getElementById("qr"),{text:APP_URL,width:180,height:180,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}

loadSettings();
addEventListener("load",renderQR);
</script>
