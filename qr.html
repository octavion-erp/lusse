<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LUSSÉ — Digital Business Card</title>
<meta name="description" content="LUSSÉ Dubai · 100% Remy human hair extensions. Tap to WhatsApp, call, email, or save my contact.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0906">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#0a0906;--surface:#141009;--surface-2:#1a140d;--surface-3:#221c14;
  --border:#2a231a;--border-2:#332a1f;
  --text:#f2ede4;--text-2:#c9c1b4;--text-3:#8b8578;
  --accent:#cba766;--accent-2:#e2c78a;--accent-dim:#8a6f42;
  --wa:#25d366;--tel:#4a90e2;
}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.5 "Jost",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
img,svg{display:block;max-width:100%}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

body{
  background:
    radial-gradient(1200px 800px at 20% 0%,rgba(203,167,102,.08),transparent 60%),
    radial-gradient(1000px 600px at 80% 100%,rgba(203,167,102,.05),transparent 60%),
    var(--bg);
  min-height:100vh;
  padding:40px 20px 60px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start
}

.card{width:100%;max-width:420px;text-align:center;animation:fadeup .6s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ==================== HERO ==================== */
.avatar{
  width:110px;height:110px;margin:8px auto 22px;border-radius:50%;
  background:linear-gradient(135deg,#1e1611,#0f0b06);
  border:1px solid rgba(203,167,102,.25);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 60px -20px rgba(203,167,102,.4)
}
.avatar img{width:60%;height:auto}
.brand{
  font-family:"Cormorant",serif;font-weight:500;font-size:32px;
  letter-spacing:.6em;color:var(--accent);padding-inline-start:.6em;
  margin:0 0 6px;line-height:1
}
.tagline{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--text-3);margin:0 0 4px}
.title{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);margin:0 0 4px;font-weight:500}
.city{font-size:13px;color:var(--text-3);margin:0}

/* ==================== PRIMARY ACTIONS ==================== */
.actions{display:grid;gap:10px;margin:32px 0}
.action{
  display:flex;align-items:center;justify-content:center;gap:10px;
  height:56px;padding:0 24px;border-radius:14px;font-size:15px;font-weight:500;
  letter-spacing:.02em;transition:.2s cubic-bezier(.2,.7,.2,1);
  background:var(--surface);border:1px solid var(--border-2);color:var(--text);
  -webkit-tap-highlight-color:transparent
}
.action:hover,.action:active{transform:translateY(-2px);background:var(--surface-2);border-color:rgba(203,167,102,.4)}
.action svg{width:22px;height:22px;flex-shrink:0}
.action.wa{background:linear-gradient(135deg,#25d366,#1eaa50);color:#fff;border-color:transparent;box-shadow:0 12px 30px -10px rgba(37,211,102,.5)}
.action.wa:hover{background:linear-gradient(135deg,#2ce072,#25b558)}
.action.primary{background:var(--accent);color:#1a1206;border-color:transparent;font-weight:600;box-shadow:0 12px 30px -10px rgba(203,167,102,.5)}
.action.primary:hover{background:var(--accent-2)}
.action.tel svg,.action.email svg{color:var(--accent)}

/* ==================== SECTION HEADER ==================== */
.hr{display:flex;align-items:center;gap:14px;margin:36px 0 20px;color:var(--text-3);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(203,167,102,.3),transparent)}

/* ==================== SOCIAL ROW ==================== */
.social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.social a{
  width:46px;height:46px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:.2s
}
.social a:hover{transform:translateY(-3px);border-color:var(--accent);color:var(--accent);background:var(--surface-2)}
.social a svg{width:20px;height:20px}

/* ==================== QR CODE ==================== */
.qr-block{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px 24px;margin-top:16px}
.qr-hd{color:var(--text-3);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px;font-weight:500}
.qr-inner{background:#fff;padding:16px;border-radius:14px;display:inline-block;margin-bottom:12px}
.qr-inner svg{width:180px;height:180px;display:block}
.qr-lb{font-size:13px;color:var(--text-3);margin-top:8px;letter-spacing:.02em}
.qr-lb b{color:var(--accent);font-weight:500}

/* ==================== VCARD / SHARE ROW ==================== */
.tools{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.tool{
  flex:1 1 140px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:42px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--border-2);color:var(--text-2);
  transition:.2s
}
.tool:hover{border-color:var(--accent);color:var(--text)}
.tool svg{width:16px;height:16px;color:var(--accent)}

/* ==================== FOOTER ==================== */
.foot{margin-top:44px;text-align:center;color:var(--text-3);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.foot a{color:var(--accent);text-decoration:none;letter-spacing:.18em}

/* ==================== TOAST ==================== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:#1a140d;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:500;z-index:100;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){.brand{font-size:26px}.action{height:52px;font-size:14px}}
</style>
</head>
<body>

<main class="card">
  <div class="avatar">
    <img src="/brand/lusse-logo-gold.svg" alt="LUSSÉ" width="66" height="66">
  </div>
  <h1 class="brand">L U S S É</h1>
  <p class="tagline">Remy Human Hair · Dubai</p>
  <p class="title" id="tagline">100% Remy Human Hair Extensions</p>
  <p class="city" id="city">Dubai · UAE</p>

  <div class="actions">
    <a class="action wa" id="waAction" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      <span>WhatsApp</span>
    </a>
    <a class="action tel" id="telAction" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span id="telLabel">Call</span>
    </a>
    <a class="action email" id="emailAction" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
      <span id="emailLabel">Email</span>
    </a>
    <button class="action primary" id="saveVcard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg>
      Save to Contacts
    </button>
  </div>

  <div class="hr">Follow</div>
  <div class="social" id="social"></div>

  <div class="qr-block">
    <div class="qr-hd">Scan · Share the card</div>
    <div class="qr-inner"><div id="qr"></div></div>
    <div class="qr-lb">or share <b>lussehair.com/qr</b></div>
    <div class="tools">
      <button class="tool" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
        Share
      </button>
      <button class="tool" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy link
      </button>
    </div>
  </div>

  <div class="foot">
    <a href="/">lussehair.com</a>
  </div>
</main>

<div class="toast" id="toast"></div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="/js/qr-e6763e1d.js"></script>
</body>
</html>
